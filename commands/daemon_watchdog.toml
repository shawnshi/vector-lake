description = "Launch the real-time ingest watcher as the long-running background compiler for raw sources."
prompt = '''
First call `mcp_runtime_status` and require `stale=false` plus an absolute `source_root`. Resolve the plugin root from that source and require its `watchdog_sync.py` and `.mcp.json`; fail closed instead of using the current working directory or a fixed checkout. Start the authoritative script as a hidden background process and let it bootstrap its paired runtime paths. Report success only after the process remains alive and its status resolves to the same effective meta root; a PID alone is not health. Do not substitute a one-off `sync` run.
'''
