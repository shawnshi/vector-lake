[package]
name = "vector-lake-core"
version = "0.1.0"
edition = "2021"
description = "Rust native performance acceleration core for Vector Lake"
license = "MIT"

[lib]
name = "vector_lake_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
pulldown-cmark = { version = "0.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
