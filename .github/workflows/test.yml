name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-python:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.13.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci-bootstrap.lock.txt
            requirements-ci.lock.txt
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-ci-bootstrap.lock.txt
          python -m pip install --no-build-isolation --require-hashes -r requirements-ci.lock.txt
          python -m pip check
      - name: Static analysis
        run: >-
          python -m ruff check --no-cache --isolated
          --select E4,E7,E9,F vector_lake tests
      - name: Compile runtime
        run: python -m compileall -q vector_lake tests
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONIOENCODING: utf-8
          PYTHONHASHSEED: "0"
        run: python -m pytest -p no:cacheprovider -q
